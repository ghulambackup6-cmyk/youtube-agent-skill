<!doctype html>
<html><head><meta charset="utf-8"><title>motion scenes</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script>
/* Code-drawn motion graphics for Fajrlight Stories.
   Every frame is a pure function of time: renderAt(t) draws the same picture for the same t.
   Motion follows the motion-design rules: everything eased, nothing linear except drift,
   staggered entrances (2-4 frames), anticipation -> action -> settle. */
const P = new URLSearchParams(location.search);
const W = +(P.get('w') || 1080), H = +(P.get('h') || 1920);
const c = document.getElementById('c'); c.width = W; c.height = H;
const g = c.getContext('2d');
let TL = null;   // timeline: {lines:[{start,end,scene,...,words:[{w,s,e}]}], total, palette}

// ---------- maths ----------
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const easeInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeIn = x => x * x * x;
const backOut = x => { const k = 1.70158; return 1 + (k + 1) * Math.pow(x - 1, 3) + k * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;
function hash(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
const GOLD = '#e7c46a', GOLD2 = '#b8862b', NIGHT = '#070b1c', RED = '#b3262c';

// ---------- layers ----------
function sky(top, bottom) {
  const gr = g.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, top); gr.addColorStop(1, bottom);
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
}
function stars(t, n = 180, alpha = 1) {
  for (let i = 0; i < n; i++) {
    const x = hash(i) * W, y = hash(i + 99) * H * .55, r = .6 + hash(i + 7) * 1.8;
    const tw = .55 + .45 * Math.sin(t * (1 + hash(i + 3) * 2) + i);
    g.globalAlpha = alpha * tw * (.4 + hash(i + 5) * .6);
    g.fillStyle = '#fff'; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  }
  g.globalAlpha = 1;
}
function moon(x, y, r, glow = 1) {
  const gr = g.createRadialGradient(x, y, r * .2, x, y, r * 5);
  gr.addColorStop(0, `rgba(255,240,200,${.35 * glow})`); gr.addColorStop(1, 'rgba(255,240,200,0)');
  g.fillStyle = gr; g.fillRect(x - r * 5, y - r * 5, r * 10, r * 10);
  g.fillStyle = '#f6ecd0'; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  g.fillStyle = 'rgba(7,11,28,1)'; g.beginPath(); g.arc(x + r * .45, y - r * .2, r * .92, 0, 7); g.fill();
}
function fog(t, y, strength = .5, color = '200,210,255') {
  for (let i = 0; i < 6; i++) {
    const ph = hash(i + 40) * 6.28, sp = 8 + hash(i + 41) * 16;
    const x = ((t * sp + hash(i + 42) * W * 2) % (W * 2)) - W * .5;
    const gr = g.createRadialGradient(x, y + Math.sin(t * .3 + ph) * 30, 10, x, y, W * .6);
    gr.addColorStop(0, `rgba(${color},${.16 * strength})`); gr.addColorStop(1, `rgba(${color},0)`);
    g.fillStyle = gr; g.fillRect(0, y - W * .6, W, W * 1.2);
  }
}
function dust(t, n = 90, color = '255,235,190', alpha = .6) {
  for (let i = 0; i < n; i++) {
    const x = (hash(i + 11) * W + Math.sin(t * .4 + i) * 40 + t * 12) % W;
    const y = (hash(i + 12) * H - t * (15 + hash(i) * 25) % H + H) % H;
    g.globalAlpha = alpha * (.3 + .7 * hash(i + 13)) * (.6 + .4 * Math.sin(t + i));
    g.fillStyle = `rgb(${color})`; g.beginPath(); g.arc(x, y, 1 + hash(i + 14) * 2.2, 0, 7); g.fill();
  }
  g.globalAlpha = 1;
}
function ground(y, color, rough = 20, seed = 0) {
  g.fillStyle = color; g.beginPath(); g.moveTo(0, H);
  for (let x = 0; x <= W + 40; x += 40) g.lineTo(x, y + Math.sin(x * .004 + seed) * rough + hash(x + seed) * rough * .5);
  g.lineTo(W, H); g.closePath(); g.fill();
}
function tomb(x, y, s, color) {
  g.fillStyle = color; g.beginPath();
  g.moveTo(x - 22 * s, y); g.lineTo(x - 22 * s, y - 60 * s);
  g.quadraticCurveTo(x, y - 95 * s, x + 22 * s, y - 60 * s); g.lineTo(x + 22 * s, y); g.fill();
}
function graves(t, y, s, color, seed, n = 9) {
  for (let i = 0; i < n; i++) {
    const x = (i + .5) / n * W + (hash(i + seed) - .5) * 80;
    tomb(x, y + hash(i + seed + 1) * 30 * s, s * (.7 + hash(i + seed + 2) * .5), color);
  }
}
function lantern(x, y, s, t, on = 1) {
  const fl = .85 + .15 * Math.sin(t * 13) * Math.sin(t * 7.3);
  const gr = g.createRadialGradient(x, y, 4, x, y, 260 * s);
  gr.addColorStop(0, `rgba(255,190,90,${.55 * fl * on})`); gr.addColorStop(1, 'rgba(255,190,90,0)');
  g.fillStyle = gr; g.fillRect(x - 300 * s, y - 300 * s, 600 * s, 600 * s);
  g.fillStyle = '#1a1208'; g.fillRect(x - 18 * s, y - 34 * s, 36 * s, 6 * s); g.fillRect(x - 14 * s, y + 26 * s, 28 * s, 6 * s);
  g.fillStyle = `rgba(255,210,120,${.95 * fl * on})`; g.fillRect(x - 13 * s, y - 28 * s, 26 * s, 54 * s);
  g.strokeStyle = '#1a1208'; g.lineWidth = 3 * s; g.strokeRect(x - 13 * s, y - 28 * s, 26 * s, 54 * s);
  g.beginPath(); g.arc(x, y - 42 * s, 9 * s, Math.PI, 0); g.stroke();
}
function person(x, y, s, t, phase, color) {   // a robed silhouette walking away, no face drawn
  const bob = Math.abs(Math.sin(t * 4 + phase)) * 4 * s;
  g.fillStyle = color;
  g.beginPath(); g.ellipse(x, y - 150 * s - bob, 17 * s, 20 * s, 0, 0, 7); g.fill();
  g.beginPath(); g.moveTo(x - 30 * s, y - bob); g.quadraticCurveTo(x - 34 * s, y - 120 * s - bob, x, y - 132 * s - bob);
  g.quadraticCurveTo(x + 34 * s, y - 120 * s - bob, x + 30 * s, y - bob); g.closePath(); g.fill();
}
function beam(x, top, bottom, w, a, color = '255,248,225') {
  const gr = g.createLinearGradient(x - w, 0, x + w, 0);
  gr.addColorStop(0, `rgba(${color},0)`); gr.addColorStop(.5, `rgba(${color},${a})`); gr.addColorStop(1, `rgba(${color},0)`);
  g.fillStyle = gr; g.fillRect(x - w, top, w * 2, bottom - top);
  const gl = g.createRadialGradient(x, bottom, 5, x, bottom, w * 3);
  gl.addColorStop(0, `rgba(${color},${a * .9})`); gl.addColorStop(1, `rgba(${color},0)`);
  g.fillStyle = gl; g.fillRect(x - w * 3, bottom - w * 3, w * 6, w * 6);
}
function vignette(a = .65) {
  const gr = g.createRadialGradient(W / 2, H / 2, H * .25, W / 2, H / 2, H * .75);
  gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, `rgba(0,0,0,${a})`);
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
}
let grainCanvas = null;
function grain(t, a = .06) {
  if (!grainCanvas) {
    grainCanvas = document.createElement('canvas'); grainCanvas.width = 256; grainCanvas.height = 256;
    const gc = grainCanvas.getContext('2d'), im = gc.createImageData(256, 256);
    for (let i = 0; i < im.data.length; i += 4) { const v = hash(i) * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
    gc.putImageData(im, 0, 0);
  }
  g.globalAlpha = a; g.globalCompositeOperation = 'overlay';
  const ox = Math.floor(hash(Math.floor(t * 24)) * 256), oy = Math.floor(hash(Math.floor(t * 24) + 1) * 256);
  for (let x = -ox; x < W; x += 256) for (let y = -oy; y < H; y += 256) g.drawImage(grainCanvas, x, y);
  g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
}
function camera(p, zoom = .08, panY = 0) {   // one slow eased push per shot
  const z = 1 + zoom * easeInOut(p);
  g.translate(W / 2, H / 2 + panY * easeInOut(p)); g.scale(z, z); g.translate(-W / 2, -H / 2);
}
function wrapText(text, maxW) {
  const words = text.split(' '), lines = []; let cur = '';
  for (const w of words) { const tst = cur ? cur + ' ' + w : w; if (g.measureText(tst).width > maxW && cur) { lines.push(cur); cur = w; } else cur = tst; }
  if (cur) lines.push(cur); return lines;
}
function glowText(text, x, y, size, color, alpha = 1, font = 'serif', maxW = W * .82, weight = '700') {
  g.font = `${weight} ${size}px "DejaVu Serif", Georgia, ${font}`; g.textAlign = 'center'; g.textBaseline = 'middle';
  const lines = wrapText(text, maxW), lh = size * 1.22, y0 = y - (lines.length - 1) * lh / 2;
  g.globalAlpha = alpha; g.shadowColor = color; g.shadowBlur = size * .6; g.fillStyle = color;
  lines.forEach((l, i) => g.fillText(l, x, y0 + i * lh));
  g.shadowBlur = 0; g.globalAlpha = 1;
}

// ---------- scenes: f(t, p, line) where p = 0..1 progress through the shot ----------
const SCENES = {
  graveyard(t, p, L, alt) {
    sky('#050816', '#1a2140'); stars(t, 200);
    moon(W * .72, H * .2, 70);
    camera(p, .1, alt ? 0 : -40);
    fog(t, H * .55, .7);
    ground(H * .62, '#0d1226', 25, 1); graves(t, H * .64, 1.0, '#0a0e1e', 3, 8);
    fog(t * 1.3, H * .7, .9);
    ground(H * .74, '#070a17', 30, 2); graves(t, H * .78, 1.6, '#04060f', 9, 5);
    // fresh grave mound with lantern
    g.fillStyle = '#120d0a'; g.beginPath(); g.ellipse(W * .5, H * .88, 260, 70, 0, Math.PI, 0); g.fill();
    lantern(W * .73, H * .84, 1.4, t);
    dust(t, 70);
  },
  mourners(t, p, L) {
    sky('#060a1c', '#232a4d'); stars(t, 160, .8); moon(W * .25, H * .17, 55);
    camera(p, .06);
    fog(t, H * .5, .9);
    ground(H * .58, '#0e1329', 18, 4);
    // silhouettes walking away up the path: they shrink as they recede, back-lit by the moon
    for (let i = 0; i < 5; i++) {
      const k = clamp(p * 1.05 - i * .05);
      const y = lerp(H * .9, H * .6, easeOut(k)), s = lerp(1.9, .4, easeOut(k));
      const x = W * (.3 + i * .1) + Math.sin(i * 2) * 40 * s;
      g.shadowColor = 'rgba(170,190,255,.55)'; g.shadowBlur = 18;
      person(x, y, s, t, i * 1.7, '#020309');
      g.shadowBlur = 0;
    }
    fog(t * 1.2, H * .8, .35);
    ground(H * .9, '#05070f', 12, 5);
    lantern(W * .18, H * .88, 1.2, t);
    dust(t, 60);
  },
  angels(t, p, L) {
    sky('#02030a', '#0d1028'); stars(t, 120, .5);
    camera(p, .07);
    const a = easeOut(seg(p, .05, .55));
    for (const [x, d] of [[W * .36, 0], [W * .64, .08]]) {
      const k = easeOut(seg(p, .05 + d, .5 + d));
      beam(x, 0, lerp(H * .2, H * .78, k), 70, .55 * k);
      // tall shape of light, no face
      g.globalAlpha = k; const gr = g.createLinearGradient(0, H * .35, 0, H * .78);
      gr.addColorStop(0, 'rgba(255,250,235,.0)'); gr.addColorStop(.3, 'rgba(255,250,235,.85)'); gr.addColorStop(1, 'rgba(255,250,235,.15)');
      g.fillStyle = gr; g.beginPath(); g.ellipse(x, H * .58, 55, 260, 0, 0, 7); g.fill(); g.globalAlpha = 1;
    }
    ground(H * .8, '#05060d', 10, 6);
    g.fillStyle = '#100b08'; g.beginPath(); g.ellipse(W * .5, H * .83, 240, 60, 0, Math.PI, 0); g.fill();
    dust(t, 120, '255,250,230', .8 * a);
  },
  card(t, p, L) {
    sky('#060914', '#121834');
    camera(p, .05);
    dust(t, 80, '231,196,106', .5);
    const enter = backOut(seg(p, 0, .22)), flip = easeInOut(seg(p, .18, .42));
    const cw = W * .74, ch = H * .36, x = W / 2, y = H * .46;
    g.save(); g.translate(x, y + (1 - enter) * 300); g.globalAlpha = clamp(enter);
    const sx = Math.abs(Math.cos(flip * Math.PI)); g.scale(Math.max(sx, .02), 1);
    const front = flip > .5;
    g.fillStyle = front ? '#0d1330' : '#141a3a'; g.strokeStyle = GOLD; g.lineWidth = 6;
    g.beginPath(); g.roundRect(-cw / 2, -ch / 2, cw, ch, 28); g.fill(); g.stroke();
    g.strokeStyle = 'rgba(231,196,106,.35)'; g.lineWidth = 2; g.beginPath(); g.roundRect(-cw / 2 + 22, -ch / 2 + 22, cw - 44, ch - 44, 18); g.stroke();
    if (!front) {
      for (let i = 0; i < 8; i++) { g.save(); g.rotate(i * Math.PI / 4); g.strokeStyle = 'rgba(231,196,106,.45)'; g.strokeRect(-60, -60, 120, 120); g.restore(); }
    } else {
      g.restore(); g.save(); g.translate(x, y);
      glowText(`QUESTION ${L.n}`, 0, -ch * .3, 46, GOLD, 1, 'serif', cw * .9, '400');
      glowText(L.card, 0, ch * .06, L.card.length > 26 ? 76 : 96, '#fff6dc', 1, 'serif', cw * .84);
    }
    g.restore();
    // previous cards stacked faintly at the bottom
    for (let i = 1; i < L.n; i++) { g.globalAlpha = .35; g.strokeStyle = GOLD; g.lineWidth = 3; g.strokeRect(W * .12 + (i - 1) * 70, H * .78, 50, 70); g.globalAlpha = 1; }
  },
  flood(t, p, L) {
    sky('#0a0b10', '#1d1a16');
    camera(p, .06);
    const k = easeOut(seg(p, 0, .5));
    // walls of the grave move outward, light pours in
    const gap = lerp(W * .3, W * .95, k);
    beam(W / 2, 0, H * .85, lerp(80, 360, k), .45 * k + .1);
    g.fillStyle = `rgba(10,8,4,${.35 * k})`; g.fillRect(0, H * .2, W, H * .2);
    g.fillStyle = '#1b130d'; g.fillRect(0, 0, (W - gap) / 2, H); g.fillRect(W - (W - gap) / 2, 0, (W - gap) / 2, H);
    dust(t, 140, '255,225,160', .7);
    if (L.quote) glowText(L.quote, W / 2, H * .3, 84, '#ffd98a', easeOut(seg(p, .35, .6)), 'serif', W * .8);
  },
  closing(t, p, L) {
    const beat = Math.pow(Math.max(0, Math.sin(t * 7.5)), 18);
    sky('#020202', '#140405');
    camera(p, .12);
    const k = easeIn(seg(p, .1, 1));
    const gap = lerp(W * .7, W * .22, k);
    g.fillStyle = '#0b0605'; g.fillRect(0, 0, (W - gap) / 2, H); g.fillRect(W - (W - gap) / 2, 0, (W - gap) / 2, H);
    g.fillStyle = `rgba(179,38,44,${.10 + beat * .18})`; g.fillRect(0, 0, W, H);
    for (let i = 0; i < 40; i++) { const y = (hash(i) * H + t * 140 * (1 + hash(i + 1))) % H; g.fillStyle = 'rgba(70,50,40,.6)'; g.fillRect((W - gap) / 2 + hash(i + 2) * gap, y, 3, 8); }
    if (L.quote) glowText(L.quote, W / 2, H * .32, 80, '#ffd9d9', easeOut(seg(p, .1, .35)), 'serif', W * .8);
  },
  lantern(t, p, L) {
    sky('#05060e', '#141a30');
    camera(p, .1, -60);
    fog(t, H * .7, .6);
    lantern(W / 2, H * .55, 3, t);
    // an open book under the lantern
    g.fillStyle = '#e9dfc4'; g.beginPath(); g.moveTo(W * .2, H * .72); g.quadraticCurveTo(W * .35, H * .68, W * .5, H * .72);
    g.quadraticCurveTo(W * .65, H * .68, W * .8, H * .72); g.lineTo(W * .8, H * .78); g.quadraticCurveTo(W * .65, H * .74, W * .5, H * .78);
    g.quadraticCurveTo(W * .35, H * .74, W * .2, H * .78); g.closePath(); g.fill();
    g.strokeStyle = 'rgba(80,60,30,.5)'; for (let i = 0; i < 6; i++) { g.beginPath(); g.moveTo(W * .25, H * (.715 + i * .009)); g.lineTo(W * .46, H * (.715 + i * .009)); g.moveTo(W * .54, H * (.715 + i * .009)); g.lineTo(W * .75, H * (.715 + i * .009)); g.stroke(); }
    dust(t, 80);
  },
  dawn(t, p, L) {
    const k = easeInOut(p);
    const gr = g.createLinearGradient(0, 0, 0, H);
    gr.addColorStop(0, '#0b1230'); gr.addColorStop(.55, `rgb(${lerp(40, 120, k) | 0},${lerp(40, 70, k) | 0},${lerp(80, 90, k) | 0})`); gr.addColorStop(1, `rgb(${lerp(80, 240, k) | 0},${lerp(60, 170, k) | 0},${lerp(60, 90, k) | 0})`);
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
    stars(t, 120, 1 - k);
    camera(p, .06);
    // minaret and dome silhouette at the horizon
    g.fillStyle = '#070912';
    g.beginPath(); g.arc(W * .5, H * .78, 150, Math.PI, 0); g.fill(); g.fillRect(W * .5 - 150, H * .78, 300, 200);
    g.fillRect(W * .22, H * .6, 36, 400); g.beginPath(); g.moveTo(W * .22 - 10, H * .6); g.lineTo(W * .22 + 18, H * .54); g.lineTo(W * .22 + 46, H * .6); g.fill();
    ground(H * .86, '#05060c', 10, 7);
    if (L.dua) glowText(L.dua, W / 2, H * .36, 56, GOLD, easeOut(seg(p, .2, .45)), 'serif', W * .84, '400');
    dust(t, 60, '255,220,170', .5);
  },
};
SCENES.card1 = SCENES.card2 = SCENES.card3 = SCENES.card;
SCENES.graveyard2 = (t, p, L) => SCENES.graveyard(t, p, L, true);

// ---------- overlays ----------
function captions(t, L) {
  if (!L.words) return;
  const i = L.words.findIndex(w => t >= w.s && t < w.e + .25);
  if (i < 0) return;
  const chunk = Math.floor(i / 4) * 4, words = L.words.slice(chunk, chunk + 4);
  let size = 78, space = 22, widths, total;
  for (;;) {   // shrink until the line fits the phone width
    g.font = `800 ${size}px "DejaVu Sans", Arial, sans-serif`; g.textAlign = 'left'; g.textBaseline = 'middle';
    widths = words.map(w => g.measureText(w.w).width);
    total = widths.reduce((a, b) => a + b, 0) + space * (words.length - 1);
    if (total < W * .88 || size < 48) break; size -= 4; space = size * .28;
  }
  let x = W / 2 - total / 2; const y = H * .7;
  g.fillStyle = 'rgba(0,0,0,.45)'; g.beginPath(); g.roundRect(x - 34, y - size * .85, total + 68, size * 1.7, size * .5); g.fill();
  words.forEach((w, j) => {
    const active = t >= w.s, cur = j + chunk === i;
    const pop = cur ? backOut(seg(t, w.s, w.s + .12)) : 1;
    g.save(); g.translate(x + widths[j] / 2, y); g.scale(.9 + .1 * pop, .9 + .1 * pop);
    g.lineWidth = 12; g.strokeStyle = 'rgba(0,0,0,.85)'; g.strokeText(w.w, -widths[j] / 2, 0);
    g.fillStyle = cur ? GOLD : (active ? '#ffffff' : 'rgba(255,255,255,.55)'); g.fillText(w.w, -widths[j] / 2, 0);
    g.restore(); x += widths[j] + space;
  });
}
function sourceCard(t, L) {
  if (!L.source) return;
  const a = easeOut(seg(t, L.start + .3, L.start + .7)) * (1 - seg(t, L.end - .3, L.end));
  if (a <= 0) return;
  g.globalAlpha = a; g.font = '600 38px "DejaVu Sans", Arial, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  const txt = 'SOURCE  ·  ' + L.source, w = g.measureText(txt).width + 60, y = H * .1 + (1 - a) * -20;
  g.fillStyle = 'rgba(5,8,20,.75)'; g.beginPath(); g.roundRect(W / 2 - w / 2, y - 36, w, 72, 36); g.fill();
  g.strokeStyle = GOLD; g.lineWidth = 3; g.stroke(); g.fillStyle = GOLD; g.fillText(txt, W / 2, y + 2); g.globalAlpha = 1;
}
function titleCard(t, L) {
  if (!L.title) return;
  const a = backOut(seg(t, L.start + .1, L.start + .5)) * (1 - seg(t, L.end - .4, L.end));
  glowText(L.title, W / 2, H * .3, 124, GOLD, clamp(a), 'serif', W * .86);
}
function brand(t) {
  g.globalAlpha = .55; g.font = '600 30px "DejaVu Sans", Arial, sans-serif'; g.textAlign = 'center'; g.fillStyle = '#fff';
  g.fillText('FAJRLIGHT STORIES', W / 2, H * .955); g.globalAlpha = 1;
}

// ---------- main ----------
function drawLine(t, L) {
  const p = seg(t, L.shotStart ?? L.start, L.shotEnd ?? L.end);   // one camera move per shot
  g.save(); (SCENES[L.scene] || SCENES.graveyard)(t, p, L); g.restore();
}
window.renderAt = function (t) {
  if (!TL) return;
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, W, H);
  const lines = TL.lines; let i = lines.findIndex(L => t < L.end); if (i < 0) i = lines.length - 1;
  const L = lines[i];
  drawLine(t, L);
  // crossfade from the previous shot over 0.35s, unless the scene continues
